autoInstallPeers: false
networkConcurrency: 4
fetchRetries: 6
fetchRetryMintimeout: 5000
fetchRetryMaxtimeout: 60000
fetchTimeout: 120000

# Exact-version exclusions for legacy transitive lockfile entries that predate
# npm provenance on their older major lines (same policy as hanzoai/insights).
# One entry per package name joined with `||` so pnpm's matcher excludes every
# listed version while keeping trustPolicy: no-downgrade active everywhere else.
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'css-declaration-sorter@6.4.1'
  - 'eslint-config-prettier@8.10.2'
  - 'semver@5.7.2 || 6.3.1'
  - 'ua-parser-js@0.7.40 || 1.0.40'
  - 'undici-types@6.19.8 || 6.21.0'
  - 'vite@5.4.21'

